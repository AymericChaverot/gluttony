[package]
name = "gluttony"
version = "0.1.0"
edition = "2021"
description = "Reclaim the disk space your toolchain ate without asking"
authors = ["Aymeric CHAVEROT"]
license = "MIT"

[[bin]]
name = "gluttony"
path = "src/main.rs"

[dependencies]
clap           = { version = "4", features = ["derive"] }
clap_complete  = "4"
walkdir        = "2"
indicatif      = "0.17"
console        = "0.15"
dialoguer      = "0.11"
rayon          = "1"
ureq           = { version = "2", features = ["json"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
thiserror      = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
